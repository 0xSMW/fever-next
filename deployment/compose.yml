# Provision credentials/roles and run reviewed migrations explicitly before web/worker.
name: fever
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Supply the rehearsed PostgreSQL 18 image by digest}
    env_file:
      - ${POSTGRES_ENV_FILE:?Supply the absolute private postgres env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
  web:
    image: ${FEVER_WEB_IMAGE:?Supply the built, tested web artifact by digest}
    env_file:
      - ${FEVER_RUNTIME_ENV_FILE:?Supply the absolute private runtime env file}
    ports: ["127.0.0.1:${FEVER_LOCAL_PORT:-3000}:3000"]
    networks: [database, egress]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 768m
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: ${FEVER_WORKER_IMAGE:?Supply the matching built, tested worker artifact by digest}
    profiles: [worker]
    env_file:
      - ${FEVER_RUNTIME_ENV_FILE:?Supply the absolute private runtime env file}
    networks: [database, egress]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    mem_limit: 1g
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
networks:
  database: { internal: true }
  egress: {}
volumes:
  postgres-data: {}
